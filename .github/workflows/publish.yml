name: Publish Library

on:
  workflow_call:
    inputs:
      module:
        description: "Gradle module path, for example :library"
        required: true
        type: string
      component_type:
        description: "Publish component type: library or plugin"
        required: true
        type: string
      publish_target:
        description: "Publish target: central, github_packages, or all"
        required: false
        default: "github_packages"
        type: string
      namespace:
        description: "Sonatype Central namespace, for example cn.entertech"
        required: false
        default: "cn.entertech"
        type: string
      publishing_type:
        description: "Central publishing type"
        required: false
        default: "user_managed"
        type: string
      publish_mode:
        description: "Package mode: release publishes final artifacts; ci publishes Central snapshots only."
        required: false
        default: "release"
        type: string
      version:
        description: "Release version. CI mode appends -SNAPSHOT before publishing."
        required: false
        default: ""
        type: string
      github_packages_repository:
        description: "GitHub Packages repository in owner/repo format. Blank uses the caller repository."
        required: false
        default: ""
        type: string
      github_packages_url:
        description: "Optional full GitHub Packages Maven repository URL"
        required: false
        default: ""
        type: string
      sync_readme:
        description: "Synchronize README code configuration after GitHub Packages publish. Requires version."
        required: false
        default: false
        type: boolean
      java_version:
        description: "JDK version used by Gradle"
        required: false
        default: "17"
        type: string
      artifact_source:
        description: "Artifact source: project builds artifacts, prebuilt consumes an existing bundle"
        required: false
        default: "project"
        type: string
      artifact_bundle_path:
        description: "Project-relative prebuilt artifact bundle directory"
        required: false
        default: ""
        type: string
      artifact_bundle_artifact:
        description: "Optional Actions artifact name to download into artifact_bundle_path"
        required: false
        default: ""
        type: string
      check_only:
        description: "Validate publication configuration without uploading artifacts"
        required: false
        default: false
        type: boolean
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: false
      MAVEN_CENTRAL_PASSWORD:
        required: false
      GPG_KEY_CONTENTS:
        required: false
      SIGNING_KEY_ID:
        required: false
      SIGNING_PASSWORD:
        required: false
      GITHUB_PACKAGES_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      MODULE_PATH: ${{ inputs.module }}
      COMPONENT_TYPE: ${{ inputs.component_type }}
      PUBLISH_TARGET: ${{ inputs.publish_target }}
      CENTRAL_NAMESPACE: ${{ inputs.namespace }}
      CENTRAL_PUBLISHING_TYPE: ${{ inputs.publishing_type }}
      PUBLISH_MODE: ${{ inputs.publish_mode }}
      PUBLISH_VERSION: ${{ inputs.version }}
      ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
      ARTIFACT_BUNDLE_PATH: ${{ inputs.artifact_bundle_path }}
      ARTIFACT_BUNDLE_ARTIFACT: ${{ inputs.artifact_bundle_artifact }}
      GITHUB_PACKAGES_REPOSITORY: ${{ inputs.github_packages_repository }}
      GITHUB_PACKAGES_URL: ${{ inputs.github_packages_url }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download prebuilt artifact bundle
        if: ${{ inputs.artifact_source == 'prebuilt' && inputs.artifact_bundle_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_bundle_artifact }}
          path: ${{ inputs.artifact_bundle_path }}

      - name: Validate publish inputs
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$MODULE_PATH" =~ ^(:[A-Za-z0-9_.-]+)+$ ]]; then
            echo "::error::module must be a Gradle project path like :library or :parent:library"
            exit 1
          fi

          case "$COMPONENT_TYPE" in
            library|plugin) ;;
            *)
              echo "::error::component_type must be library or plugin"
              exit 1
              ;;
          esac

          case "$ARTIFACT_SOURCE" in
            project)
              if [[ -n "$ARTIFACT_BUNDLE_PATH" ]]; then
                echo "::error::artifact_bundle_path is only valid for artifact_source=prebuilt"
                exit 1
              fi
              ;;
            prebuilt)
              if [[ -z "$ARTIFACT_BUNDLE_PATH" ]]; then
                echo "::error::artifact_bundle_path is required for artifact_source=prebuilt"
                exit 1
              fi
              if [[ "$ARTIFACT_BUNDLE_PATH" = /* || "$ARTIFACT_BUNDLE_PATH" == *".."* ]]; then
                echo "::error::artifact_bundle_path must be a safe project-relative path"
                exit 1
              fi
              workspace_real="$(realpath -m "$GITHUB_WORKSPACE")"
              bundle_real="$(realpath -m "$GITHUB_WORKSPACE/$ARTIFACT_BUNDLE_PATH")"
              case "$bundle_real" in
                "$workspace_real"/*) ;;
                *) echo "::error::artifact_bundle_path must stay inside the workspace"; exit 1 ;;
              esac
              if [[ ! -f "$bundle_real/publish-artifacts.json" ]]; then
                echo "::error::publish-artifacts.json is missing from $ARTIFACT_BUNDLE_PATH"
                exit 1
              fi
              ;;
            *)
              echo "::error::artifact_source must be project or prebuilt"
              exit 1
              ;;
          esac

          case "$PUBLISH_TARGET" in
            central|github_packages|all) ;;
            *)
              echo "::error::publish_target must be central, github_packages, or all"
              exit 1
              ;;
          esac

          if [[ "$CENTRAL_PUBLISHING_TYPE" != "user_managed" && "$CENTRAL_PUBLISHING_TYPE" != "automatic" ]]; then
            echo "::error::publishing_type must be user_managed or automatic"
            exit 1
          fi

          case "$PUBLISH_MODE" in
            release|ci) ;;
            *)
              echo "::error::publish_mode must be release or ci"
              exit 1
              ;;
          esac

          if [[ "$PUBLISH_MODE" == "ci" && "$PUBLISH_TARGET" != "central" ]]; then
            echo "::error::publish_mode=ci only supports publish_target=central"
            exit 1
          fi

      - name: Resolve publish version
        shell: bash
        run: |
          set -euo pipefail

          effective_version="$PUBLISH_VERSION"
          if [[ -z "$effective_version" ]]; then
            echo "::error::version is required"
            exit 1
          fi

          case "$PUBLISH_MODE" in
            ci)
              if [[ "$effective_version" != *-SNAPSHOT ]]; then
                effective_version="${effective_version}-SNAPSHOT"
              fi
              central_release_type="snapshot"
              sync_readme_effective=false
              ;;
            release)
              if [[ "$effective_version" == *-SNAPSHOT ]]; then
                echo "::error::publish_mode=release must not use a -SNAPSHOT version"
                exit 1
              fi
              central_release_type="release"
              sync_readme_effective="${{ inputs.sync_readme }}"
              ;;
          esac

          {
            echo "EFFECTIVE_PUBLISH_VERSION=${effective_version}"
            echo "CENTRAL_RELEASE_TYPE=${central_release_type}"
            echo "SYNC_README_EFFECTIVE=${sync_readme_effective}"
          } >> "$GITHUB_ENV"

      - name: Resolve publish task
        shell: bash
        run: |
          set -euo pipefail
          case "${COMPONENT_TYPE}:${PUBLISH_TARGET}" in
            library:github_packages) suffix="PublishLibraryRemoteGithubPackagesTask" ;;
            library:central) suffix="PublishLibraryRemoteCentralTask" ;;
            library:all) suffix="PublishLibraryRemoteAllTask" ;;
            plugin:github_packages) suffix="PublishPluginRemoteGithubPackagesTask" ;;
            plugin:central) suffix="PublishPluginRemoteCentralTask" ;;
            plugin:all) suffix="PublishPluginRemoteAllTask" ;;
            *) echo "::error::unsupported component_type/publish_target combination"; exit 1 ;;
          esac
          echo "PUBLISH_TASK=${MODULE_PATH}:${suffix}" >> "$GITHUB_ENV"

      - name: Publish prepared or project artifacts
        shell: bash
        env:
          GITHUB_ACTOR: ${{ !inputs.check_only && (inputs.publish_target == 'github_packages' || inputs.publish_target == 'all') && github.actor || '' }}
          GITHUB_TOKEN: ${{ !inputs.check_only && (inputs.publish_target == 'github_packages' || inputs.publish_target == 'all') && (secrets.GITHUB_PACKAGES_TOKEN || github.token) || '' }}
          GITHUB_PACKAGES_TOKEN: ${{ !inputs.check_only && (inputs.publish_target == 'github_packages' || inputs.publish_target == 'all') && (secrets.GITHUB_PACKAGES_TOKEN || github.token) || '' }}
          CENTRAL_USERNAME: ${{ !inputs.check_only && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.MAVEN_CENTRAL_USERNAME || '' }}
          CENTRAL_PASSWORD: ${{ !inputs.check_only && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.MAVEN_CENTRAL_PASSWORD || '' }}
          MAVEN_CENTRAL_USERNAME: ${{ !inputs.check_only && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.MAVEN_CENTRAL_USERNAME || '' }}
          MAVEN_CENTRAL_PASSWORD: ${{ !inputs.check_only && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.MAVEN_CENTRAL_PASSWORD || '' }}
          GPG_KEY_CONTENTS: ${{ !inputs.check_only && inputs.artifact_source == 'project' && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.GPG_KEY_CONTENTS || '' }}
          SIGNING_KEY_ID: ${{ !inputs.check_only && inputs.artifact_source == 'project' && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.SIGNING_KEY_ID || '' }}
          SIGNING_PASSWORD: ${{ !inputs.check_only && inputs.artifact_source == 'project' && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.SIGNING_PASSWORD || '' }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ !inputs.check_only && inputs.artifact_source == 'project' && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.GPG_KEY_CONTENTS || '' }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ !inputs.check_only && inputs.artifact_source == 'project' && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.SIGNING_KEY_ID || '' }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ !inputs.check_only && inputs.artifact_source == 'project' && (inputs.publish_target == 'central' || inputs.publish_target == 'all') && secrets.SIGNING_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ "${{ inputs.check_only }}" == "true" ]]; then
            check_args=("${MODULE_PATH}:checkPublish" "-PcheckPublishTarget=${PUBLISH_TARGET}" "-PpublishValidationLevel=structure" "-PpublishVersion=${EFFECTIVE_PUBLISH_VERSION}" "-PartifactSource=${ARTIFACT_SOURCE}" --no-daemon --stacktrace)
            if [[ "$ARTIFACT_SOURCE" == "prebuilt" ]]; then
              check_args+=("-PartifactBundlePath=${ARTIFACT_BUNDLE_PATH}")
            fi
            ./gradlew "${check_args[@]}"
            exit 0
          fi
          if [[ "$PUBLISH_TARGET" == "central" || "$PUBLISH_TARGET" == "all" ]]; then
            required_central_env=(CENTRAL_USERNAME CENTRAL_PASSWORD)
            if [[ "$ARTIFACT_SOURCE" == "project" ]]; then
              required_central_env+=(GPG_KEY_CONTENTS SIGNING_PASSWORD)
            fi
            for name in "${required_central_env[@]}"; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::$name is required when publish_target is $PUBLISH_TARGET"
                exit 1
              fi
            done
          fi
          if [[ "$PUBLISH_TARGET" == "github_packages" || "$PUBLISH_TARGET" == "all" ]] && [[ -z "${GITHUB_TOKEN:-}" ]]; then
            echo "::error::GITHUB_TOKEN or GITHUB_PACKAGES_TOKEN is required when publish_target is $PUBLISH_TARGET"
            exit 1
          fi
          args=("${PUBLISH_TASK}" "-PcentralReleaseType=${CENTRAL_RELEASE_TYPE}" "-PcentralNamespace=${CENTRAL_NAMESPACE}" "-PcentralPublishingType=${CENTRAL_PUBLISHING_TYPE}" "--no-daemon" "--stacktrace")
          if [[ -n "$EFFECTIVE_PUBLISH_VERSION" ]]; then args+=("-PpublishVersion=${EFFECTIVE_PUBLISH_VERSION}"); fi
          if [[ -n "$GITHUB_PACKAGES_REPOSITORY" ]]; then args+=("-PgithubPackagesRepository=${GITHUB_PACKAGES_REPOSITORY}"); fi
          if [[ -n "$GITHUB_PACKAGES_URL" ]]; then args+=("-PgithubPackagesUrl=${GITHUB_PACKAGES_URL}"); fi
          if [[ "$ARTIFACT_SOURCE" == "prebuilt" ]]; then
            args+=("-PartifactSource=prebuilt" "-PartifactBundlePath=${ARTIFACT_BUNDLE_PATH}")
          fi
          ./gradlew "${args[@]}"

      - name: Upload publish manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publish-manifest
          path: "**/build/reports/publish/publish-manifest.*"
          if-no-files-found: ignore

  sync_readme:
    needs: publish
    if: ${{ needs.publish.result == 'success' && inputs.sync_readme && inputs.publish_mode == 'release' && inputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH_TARGET: ${{ inputs.publish_target }}
      PUBLISH_VERSION: ${{ inputs.version }}
      GITHUB_PACKAGES_REPOSITORY: ${{ inputs.github_packages_repository }}
      GITHUB_PACKAGES_URL: ${{ inputs.github_packages_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Sync README for release
        shell: bash
        run: |
          set -euo pipefail

          readme_github_packages_url="$GITHUB_PACKAGES_URL"
          if [[ "$PUBLISH_TARGET" == "github_packages" || "$PUBLISH_TARGET" == "all" ]] && [[ -z "$readme_github_packages_url" ]]; then
            readme_github_packages_repository="$GITHUB_PACKAGES_REPOSITORY"
            if [[ -z "$readme_github_packages_repository" ]]; then
              readme_github_packages_repository="$GITHUB_REPOSITORY"
            fi
            readme_github_packages_url="https://maven.pkg.github.com/${readme_github_packages_repository}"
          fi
          export README_GITHUB_PACKAGES_URL="$readme_github_packages_url"

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          version = os.environ["PUBLISH_VERSION"]
          publish_target = os.environ["PUBLISH_TARGET"]
          github_packages_url = os.environ["README_GITHUB_PACKAGES_URL"]
          readme_path = Path("README.md")
          if not readme_path.exists():
              print("README.md does not exist; skipping README sync")
              raise SystemExit(0)
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"version must use digits.digits.digits format for README sync, got {version}")

          content = readme_path.read_text(encoding="utf-8")
          content = re.sub(
              r'classpath\("cn\.entertech\.android:publish:[^"]+"\)',
              f'classpath("cn.entertech.android:publish:{version}")',
              content,
          )
          content = re.sub(
              r"cn\.entertech\.android:publish:(?:<version>|\d+\.\d+\.\d+)",
              f"cn.entertech.android:publish:{version}",
              content,
          )
          content = re.sub(
              r"cn\.entertech\.publish:cn\.entertech\.publish\.gradle\.plugin:(?:<version>|\d+\.\d+\.\d+)",
              f"cn.entertech.publish:cn.entertech.publish.gradle.plugin:{version}",
              content,
          )
          content = re.sub(
              r'id\("cn\.entertech\.publish"\) version "(?:<version>|\d+\.\d+\.\d+)"',
              f'id("cn.entertech.publish") version "{version}"',
              content,
          )
          block_re = re.compile(
              r"(?ms)(buildscript\s*\{\s*repositories\s*\{\n)(?P<body>.*?)(\n\s*\}\s*\n\s*\n\s*dependencies\s*\{\s*classpath\(\"cn\.entertech\.android:publish:)"
          )
          if publish_target in ("github_packages", "all"):
              repository_block = "\n".join([
                  "        google()",
                  "        mavenLocal()",
                  "        maven {",
                  f"            url = uri(\"{github_packages_url}\")",
                  "            credentials {",
                  "                username = providers.gradleProperty(\"gpr.user\").orNull",
                  "                    ?: System.getenv(\"GITHUB_ACTOR\")",
                  "                password = providers.gradleProperty(\"gpr.key\").orNull",
                  "                    ?: System.getenv(\"GITHUB_TOKEN\")",
                  "            }",
                  "        }",
              ])
          else:
              repository_block = "\n".join([
                  "        google()",
                  "        mavenCentral()",
                  "        mavenLocal()",
              ])
          content, count = block_re.subn(lambda match: match.group(1) + repository_block + match.group(3), content, count=1)
          if count == 0:
              print("README code configuration block was not found; version sync still applied")
          readme_path.write_text(content, encoding="utf-8")
          PY

      - name: Commit README sync
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "README.md already documents ${PUBLISH_VERSION}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "[codex] Sync README publish config to ${PUBLISH_VERSION} [skip ci]"
          git push
